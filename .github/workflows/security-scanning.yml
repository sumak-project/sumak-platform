name: Security Scanning

on:
    pull_request:
      branches:
        - dev

permissions:
  contents: read
  pull-requests: read

# A waiver requires a named owner, written rationale, and a reviewed
# architecture/decisions/ ADR. Scanner exceptions must never be silent.
jobs:
  dependency-review:
    name: Dependency vulnerability review
    runs-on: ubuntu-latest
    steps:
      - name: Check out the reviewed commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect reviewed dependency input changes
        id: dependency-changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          scripts/ci/detect_changes.py \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --github-output "$GITHUB_OUTPUT"
      - name: Report unchanged dependency inputs
        if: steps.dependency-changes.outputs.gradle_dependency_inputs_changed != 'true'
        run: echo "No reviewed Gradle dependency inputs changed; vulnerability delta is empty."
      - name: Prepare isolated Gradle cache
        if: steps.dependency-changes.outputs.gradle_dependency_inputs_changed == 'true'
        run: printf 'GRADLE_USER_HOME=%s\n' "$RUNNER_TEMP/gradle-home" >> "$GITHUB_ENV"
      - name: Set up Java 21
        if: steps.dependency-changes.outputs.gradle_dependency_inputs_changed == 'true'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        if: steps.dependency-changes.outputs.gradle_dependency_inputs_changed == 'true'
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      # Resolve every Gradle configuration into an isolated cache. Trivy scans
      # the resolved JAR metadata directly, so this gate does not depend on
      # repository-level dependency graph settings or expose credentials.
      - name: Resolve reviewed Gradle dependencies
        if: steps.dependency-changes.outputs.gradle_dependency_inputs_changed == 'true'
        run: |
          set -euo pipefail
          init_script="$RUNNER_TEMP/resolve-dependencies.init.gradle"
          cat >"$init_script" <<'EOF'
          gradle.projectsEvaluated {
              rootProject.tasks.register("resolveAllCiDependencies") {
                  doLast {
                      rootProject.allprojects.each { project ->
                          project.configurations
                              .findAll { configuration -> configuration.canBeResolved }
                              .each { configuration -> configuration.resolve() }
                      }
                  }
              }
          }
          EOF
          ./gradlew resolveAllCiDependencies --init-script "$init_script" --no-daemon
      - name: Reject high or critical dependency vulnerabilities
        if: steps.dependency-changes.outputs.gradle_dependency_inputs_changed == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          scan-type: rootfs
          scan-ref: ${{ env.GRADLE_USER_HOME }}/caches/modules-2/files-2.1
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false
          hide-progress: true

  secret-scan:
    name: Tracked source and history secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks
        run: |
          set -euo pipefail
          scripts/security/install-gitleaks.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Scan full history without exposing secret values
        run: |
          set -euo pipefail
          gitleaks git --redact --no-banner --exit-code 1 .

  source-security:
    name: Source and workflow permission review
    runs-on: ubuntu-latest
    steps:
      - name: Check out the reviewed commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install pinned Semgrep
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "semgrep==1.187.0"
      - name: Scan source with repository-owned rules
        run: |
          set -euo pipefail
          semgrep scan \
            --config config/security/semgrep.yml \
            --metrics=off \
            --error \
            .
      - name: Audit GitHub Actions permissions and integrity
        uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
        with:
          advanced-security: false
          annotations: true
          online-audits: false
          strict-collection: true
          min-severity: medium
          min-confidence: medium
          version: "1.33.1"
