name: PR Validation

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform quality gates
    runs-on: ubuntu-latest
    continue-on-error: false
    strategy:
      fail-fast: true
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      AWS_PROFILE: sumak-dev
      AWS_REGION: us-east-1
    steps:
      - name: Check out the reviewed commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.10.5"
      - name: Prepare isolated Terraform cache
        run: |
          set -euo pipefail
          plugin_cache_dir="$RUNNER_TEMP/terraform-plugin-cache"
          cli_config_file="$RUNNER_TEMP/terraform.tfrc"
          mkdir -p "$plugin_cache_dir"
          printf 'TF_PLUGIN_CACHE_DIR=%s\n' "$plugin_cache_dir" >> "$GITHUB_ENV"
          printf 'TF_CLI_CONFIG_FILE=%s\n' "$cli_config_file" >> "$GITHUB_ENV"
          cat >"$cli_config_file" <<EOF
          plugin_cache_dir = "$plugin_cache_dir"
          disable_checkpoint = true
          EOF
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra
      - name: Initialize and validate Terraform roots
        run: |
          set -euo pipefail
          mapfile -t roots < <(find infra/accounts -name versions.tf -type f -print | sort)
          if (( ${#roots[@]} == 0 )); then
            echo "::error::No Terraform account roots were found"
            exit 1
          fi
          for file in "${roots[@]}"; do
            root="${file%/versions.tf}"
            root_id="$(printf '%s' "$root" | sha256sum | cut -c1-16)"
            export TF_DATA_DIR="$RUNNER_TEMP/terraform-data/validate/$root_id"
            terraform -chdir="$root" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$root" validate
          done
      - name: Scan Terraform security and policy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infra
          severity: HIGH,CRITICAL
          exit-code: "1"
          hide-progress: true
      - name: Create reviewed Terraform plans
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SUMAK_DEV_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SUMAK_DEV_AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.SUMAK_DEV_AWS_SESSION_TOKEN }}
          EXPECTED_AWS_ACCOUNT_ID: ${{ vars.SUMAK_DEV_AWS_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          credentials_file="$RUNNER_TEMP/sumak-aws-credentials"
          export AWS_SHARED_CREDENTIALS_FILE="$credentials_file"
          trap 'rm -f "$credentials_file"' EXIT
          if [[ -z "$AWS_ACCESS_KEY_ID" || -z "$AWS_SECRET_ACCESS_KEY" || -z "$AWS_SESSION_TOKEN" || -z "$EXPECTED_AWS_ACCOUNT_ID" ]]; then
            echo "::error::BLOCKED_PERMISSIONS: temporary sumak-dev credentials and expected account ID are required"
            exit 1
          fi
          aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID" --profile sumak-dev
          aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY" --profile sumak-dev
          aws configure set aws_session_token "$AWS_SESSION_TOKEN" --profile sumak-dev
          actual_account_id="$(aws sts get-caller-identity --profile sumak-dev --query Account --output text)"
          if [[ "$actual_account_id" != "$EXPECTED_AWS_ACCOUNT_ID" ]]; then
            echo "::error::BLOCKED_PERMISSIONS: STS account does not match the configured sumak-dev account"
            exit 1
          fi
          plan_dir="$RUNNER_TEMP/terraform-plans"
          mkdir -p "$plan_dir"
          plan_roots=(
            "infra/accounts/sumak-dev/us-east-1/dev/network"
            "infra/accounts/sumak-dev/us-east-1/dev/network-boundaries"
          )
          for root in "${plan_roots[@]}"; do
            if [[ ! -f "$root/versions.tf" ]]; then
              echo "::error::Configured Terraform plan root does not exist: $root"
              exit 1
            fi
            root_id="$(printf '%s' "$root" | sha256sum | cut -c1-16)"
            export TF_DATA_DIR="$RUNNER_TEMP/terraform-data/plan/$root_id"
            terraform -chdir="$root" init -input=false -lockfile=readonly
            terraform -chdir="$root" plan \
              -input=false \
              -lock=false \
              -out="$plan_dir/$root_id.tfplan"
          done
      - name: Upload limited-retention Terraform plans
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: terraform-plans-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/terraform-plans/*.tfplan
          if-no-files-found: error
          retention-days: 1

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the reviewed commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Validate branch name and PR title
        env:
          BRANCH_NAME: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          # Validate branch name: <type>/<JIRA-KEY>-<kebab-case>
          # types: feat, fix, chore, refactor, test, docs, ci
          if ! echo "$BRANCH_NAME" | grep -Eq '^(feat|fix|chore|refactor|test|docs|ci)/[A-Z][A-Z0-9_]+-[0-9]+-[a-z0-9]+(-[a-z0-9]+)*$'; then
            echo "::error::Branch name '$BRANCH_NAME' does not follow <type>/<JIRA-KEY>-<kebab-case> (types: feat, fix, chore, refactor, test, docs, ci)"
            exit 1
          fi
          echo "Branch name OK: $BRANCH_NAME"

          # Validate PR title: <type>(<scope>): <description> [<JIRA-KEY>]
          if ! echo "$PR_TITLE" | grep -Eq '^(feat|fix|chore|refactor|test|docs|ci)\([a-z0-9_-]+\): .+ \[[A-Z][A-Z0-9_]+-[0-9]+\]$'; then
            echo "::error::PR title '$PR_TITLE' does not follow Conventional Commits with Jira key: <type>(<scope>): <description> [<JIRA-KEY>]"
            exit 1
          fi
          echo "PR title OK: $PR_TITLE"
      - name: Check Gradle project
        run: ./gradlew check --no-daemon
      - name: Test quality gate policy
        run: python3 -m unittest discover -s tests -v
