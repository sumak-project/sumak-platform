name: PR Validation

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  changes:
    name: Route reviewed changes
    runs-on: ubuntu-latest
    outputs:
      terraform_changed: ${{ steps.route.outputs.terraform_changed }}
      contract_changed: ${{ steps.route.outputs.contract_changed }}
      gradle_changed: ${{ steps.route.outputs.gradle_changed }}
      gradle_tasks: ${{ steps.route.outputs.gradle_tasks }}
    steps:
      - name: Check out the reviewed commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect and route reviewed paths
        id: route
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          scripts/ci/detect_changes.py \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --github-output "$GITHUB_OUTPUT"

  terraform:
    name: Terraform quality gates
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    continue-on-error: false
    strategy:
      fail-fast: true
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      AWS_PROFILE: sumak-dev
      AWS_REGION: us-east-1
    steps:
      - name: Check out the reviewed commit
        if: needs.changes.result == 'success' && needs.changes.outputs.terraform_changed == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Terraform
        if: needs.changes.result == 'success' && needs.changes.outputs.terraform_changed == 'true'
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.10.5"
      - name: Prepare isolated Terraform cache
        if: needs.changes.result == 'success' && needs.changes.outputs.terraform_changed == 'true'
        run: |
          set -euo pipefail
          plugin_cache_dir="$RUNNER_TEMP/terraform-plugin-cache"
          cli_config_file="$RUNNER_TEMP/terraform.tfrc"
          mkdir -p "$plugin_cache_dir"
          printf 'TF_PLUGIN_CACHE_DIR=%s\n' "$plugin_cache_dir" >> "$GITHUB_ENV"
          printf 'TF_CLI_CONFIG_FILE=%s\n' "$cli_config_file" >> "$GITHUB_ENV"
          cat >"$cli_config_file" <<EOF
          plugin_cache_dir = "$plugin_cache_dir"
          disable_checkpoint = true
          EOF
      - name: Check Terraform formatting
        if: needs.changes.result == 'success' && needs.changes.outputs.terraform_changed == 'true'
        run: terraform fmt -check -recursive infra
      - name: Initialize and validate Terraform roots
        if: needs.changes.result == 'success' && needs.changes.outputs.terraform_changed == 'true'
        run: |
          set -euo pipefail
          mapfile -t roots < <(find infra/accounts -name versions.tf -type f -print | sort)
          if (( ${#roots[@]} == 0 )); then
            echo "::error::No Terraform account roots were found"
            exit 1
          fi
          for file in "${roots[@]}"; do
            root="${file%/versions.tf}"
            root_id="$(printf '%s' "$root" | sha256sum | cut -c1-16)"
            export TF_DATA_DIR="$RUNNER_TEMP/terraform-data/validate/$root_id"
            terraform -chdir="$root" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$root" validate
          done
      - name: Scan Terraform security and policy
        if: needs.changes.result == 'success' && needs.changes.outputs.terraform_changed == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infra
          severity: HIGH,CRITICAL
          exit-code: "1"
          hide-progress: true
      - name: Create reviewed Terraform plans
        if: needs.changes.result == 'success' && needs.changes.outputs.terraform_changed == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SUMAK_DEV_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SUMAK_DEV_AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.SUMAK_DEV_AWS_SESSION_TOKEN }}
          EXPECTED_AWS_ACCOUNT_ID: ${{ vars.SUMAK_DEV_AWS_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          credentials_file="$RUNNER_TEMP/sumak-aws-credentials"
          export AWS_SHARED_CREDENTIALS_FILE="$credentials_file"
          trap 'rm -f "$credentials_file"' EXIT
          if [[ -z "$AWS_ACCESS_KEY_ID" || -z "$AWS_SECRET_ACCESS_KEY" || -z "$AWS_SESSION_TOKEN" || -z "$EXPECTED_AWS_ACCOUNT_ID" ]]; then
            echo "::error::BLOCKED_PERMISSIONS: temporary sumak-dev credentials and expected account ID are required"
            exit 1
          fi
          aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID" --profile sumak-dev
          aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY" --profile sumak-dev
          aws configure set aws_session_token "$AWS_SESSION_TOKEN" --profile sumak-dev
          actual_account_id="$(aws sts get-caller-identity --profile sumak-dev --query Account --output text)"
          if [[ "$actual_account_id" != "$EXPECTED_AWS_ACCOUNT_ID" ]]; then
            echo "::error::BLOCKED_PERMISSIONS: STS account does not match the configured sumak-dev account"
            exit 1
          fi
          plan_dir="$RUNNER_TEMP/terraform-plans"
          mkdir -p "$plan_dir"
          plan_roots=(
            "infra/accounts/sumak-dev/us-east-1/dev/network"
            "infra/accounts/sumak-dev/us-east-1/dev/network-boundaries"
          )
          for root in "${plan_roots[@]}"; do
            if [[ ! -f "$root/versions.tf" ]]; then
              echo "::error::Configured Terraform plan root does not exist: $root"
              exit 1
            fi
            root_id="$(printf '%s' "$root" | sha256sum | cut -c1-16)"
            export TF_DATA_DIR="$RUNNER_TEMP/terraform-data/plan/$root_id"
            terraform -chdir="$root" init -input=false -lockfile=readonly
            terraform -chdir="$root" plan \
              -input=false \
              -lock=false \
              -out="$plan_dir/$root_id.tfplan"
          done
      - name: Upload limited-retention Terraform plans
        if: needs.changes.result == 'success' && needs.changes.outputs.terraform_changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: terraform-plans-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/terraform-plans/*.tfplan
          if-no-files-found: error
          retention-days: 1
      - name: Require a resolved Terraform routing decision
        if: always()
        env:
          ROUTING_RESULT: ${{ needs.changes.result }}
          TERRAFORM_CHANGED: ${{ needs.changes.outputs.terraform_changed }}
        run: |
          if [[ "$ROUTING_RESULT" != "success" || ! "$TERRAFORM_CHANGED" =~ ^(true|false)$ ]]; then
            echo "::error::BLOCKED: Terraform checks require a successful, explicit path-routing decision"
            exit 1
          fi

  validate:
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check out the reviewed commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Run deterministic contract checks
        id: contract_checks
        if: needs.changes.result == 'success' && needs.changes.outputs.contract_changed == 'true'
        run: |
          set -euo pipefail
          python3 contracts/catalog/api-migration/generate_matrix.py --check
          python3 contracts/executable/tools/generar.py --check
          python3 contracts/executable/tools/integraciones.py
          python3 contracts/executable/tools/trazabilidad.py
          python3 contracts/executable/tools/compatibilidad.py
          node contracts/executable/tools/validar.cjs
          python3 contracts/executable/tools/revisar_estructura.py
          (
            cd contracts/executable
            python3 -m unittest discover -s tests -v
          )
      - name: Require official contract compiler prerequisites
        id: official_compiler_checks
        if: needs.changes.result == 'success' && needs.changes.outputs.contract_changed == 'true'
        env:
          GITHUB_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 scripts/ci/check_official_contract_compilers.py \
            --root . \
            --manifest contracts/executable/validacion/compiler-manifest.json \
            --evidence "$RUNNER_TEMP/official-contract-compiler-evidence.json"
      - name: Upload official compiler prerequisite evidence
        if: always() && needs.changes.result == 'success' && needs.changes.outputs.contract_changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: official-contract-compiler-evidence-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/official-contract-compiler-evidence.json
          if-no-files-found: error
          retention-days: 14
      - name: Validate branch name and PR title
        env:
          BRANCH_NAME: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          # Validate branch name: <type>/<JIRA-KEY>-<kebab-case>
          # types: feat, fix, chore, refactor, test, docs, ci
          if ! echo "$BRANCH_NAME" | grep -Eq '^(feat|fix|chore|refactor|test|docs|ci)/[A-Z][A-Z0-9_]+-[0-9]+-[a-z0-9]+(-[a-z0-9]+)*$'; then
            echo "::error::Branch name '$BRANCH_NAME' does not follow <type>/<JIRA-KEY>-<kebab-case> (types: feat, fix, chore, refactor, test, docs, ci)"
            exit 1
          fi
          echo "Branch name OK: $BRANCH_NAME"

          # Validate PR title: <type>(<scope>): <description> [<JIRA-KEY>]
          if ! echo "$PR_TITLE" | grep -Eq '^(feat|fix|chore|refactor|test|docs|ci)\([a-z0-9_-]+\): .+ \[[A-Z][A-Z0-9_]+-[0-9]+\]$'; then
            echo "::error::PR title '$PR_TITLE' does not follow Conventional Commits with Jira key: <type>(<scope>): <description> [<JIRA-KEY>]"
            exit 1
          fi
          echo "PR title OK: $PR_TITLE"
      - name: Validate mandatory six-gate policy
        run: |
          set -euo pipefail
          python3 config/quality-gates/validate_promotion.py --policy-only | tee "$RUNNER_TEMP/gate-policy.txt"
          {
            echo "## Mandatory quality-gate policy"
            echo
            echo '```text'
            cat "$RUNNER_TEMP/gate-policy.txt"
            echo '```'
            echo
            echo "Missing, failed, pending, skipped, cancelled, NOT_RUN, blocked, or waived mandatory gate evidence blocks DEV-to-QA promotion."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Check Gradle project
        id: gradle_checks
        if: needs.changes.result == 'success' && needs.changes.outputs.gradle_changed == 'true'
        env:
          GRADLE_TASKS: ${{ needs.changes.outputs.gradle_tasks }}
        run: ./gradlew $GRADLE_TASKS --no-daemon
      - name: Test quality gate policy
        run: python3 -m unittest discover -s tests -v
      - name: Require a resolved validation routing decision
        if: always()
        env:
          ROUTING_RESULT: ${{ needs.changes.result }}
          CONTRACT_CHANGED: ${{ needs.changes.outputs.contract_changed }}
          GRADLE_CHANGED: ${{ needs.changes.outputs.gradle_changed }}
          CONTRACT_CHECK_OUTCOME: ${{ steps.contract_checks.outcome }}
          OFFICIAL_COMPILER_OUTCOME: ${{ steps.official_compiler_checks.outcome }}
          GRADLE_CHECK_OUTCOME: ${{ steps.gradle_checks.outcome }}
        run: |
          if [[ "$ROUTING_RESULT" != "success" \
            || ! "$CONTRACT_CHANGED" =~ ^(true|false)$ \
            || ! "$GRADLE_CHANGED" =~ ^(true|false)$ ]]; then
            echo "::error::BLOCKED: validation did not receive successful, explicit path-routing decisions"
            exit 1
          fi
          if [[ "$CONTRACT_CHANGED" == "true" && "$CONTRACT_CHECK_OUTCOME" != "success" ]]; then
            echo "::error::BLOCKED: required contract validation did not complete successfully"
            exit 1
          fi
          if [[ "$CONTRACT_CHANGED" == "true" && "$OFFICIAL_COMPILER_OUTCOME" != "success" ]]; then
            echo "::error::BLOCKED_CONTRACT: official compiler prerequisites or execution are incomplete"
            exit 1
          fi
          if [[ "$CONTRACT_CHANGED" == "false" && "$CONTRACT_CHECK_OUTCOME" != "skipped" ]]; then
            echo "::error::BLOCKED: contract validation ran without an explicit contract change"
            exit 1
          fi
          if [[ "$CONTRACT_CHANGED" == "false" && "$OFFICIAL_COMPILER_OUTCOME" != "skipped" ]]; then
            echo "::error::BLOCKED_CONTRACT: official compiler gate ran without an explicit contract change"
            exit 1
          fi
          if [[ "$GRADLE_CHANGED" == "true" && "$GRADLE_CHECK_OUTCOME" != "success" ]]; then
            echo "::error::BLOCKED: required Gradle validation did not complete successfully"
            exit 1
          fi
          if [[ "$GRADLE_CHANGED" == "false" && "$GRADLE_CHECK_OUTCOME" != "skipped" ]]; then
            echo "::error::BLOCKED: Gradle validation ran without an explicit Gradle change"
            exit 1
          fi
