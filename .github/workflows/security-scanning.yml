name: Security Scanning

on:
    pull_request:
      branches:
        - dev

permissions:
  contents: read
  pull-requests: read

# A waiver requires a named owner, written rationale, and a reviewed
# architecture/decisions/ ADR. Scanner exceptions must never be silent.
jobs:
  dependency-review:
    name: Dependency vulnerability review
    runs-on: ubuntu-latest
    steps:
      - name: Check out the reviewed commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # GitHub's dependency graph evaluates Gradle manifests and version catalogs,
      # plus supported pnpm, npm, Python, and other ecosystem lockfiles.
      - name: Reject vulnerable dependency changes
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
          vulnerability-check: true
          warn-only: false
          comment-summary-in-pr: never
          show-openssf-scorecard: false

  secret-scan:
    name: Tracked source and history secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks
        run: |
          set -euo pipefail
          scripts/security/install-gitleaks.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Scan full history without exposing secret values
        run: |
          set -euo pipefail
          gitleaks git --redact --no-banner --exit-code 1 .

  source-security:
    name: Source and workflow permission review
    runs-on: ubuntu-latest
    steps:
      - name: Check out the reviewed commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install pinned Semgrep
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "semgrep==1.187.0"
      - name: Scan source with repository-owned rules
        run: |
          set -euo pipefail
          semgrep scan \
            --config config/security/semgrep.yml \
            --metrics=off \
            --error \
            .
      - name: Audit GitHub Actions permissions and integrity
        uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
        with:
          advanced-security: false
          annotations: true
          online-audits: false
          strict-collection: true
          min-severity: medium
          min-confidence: medium
          version: "1.33.1"
